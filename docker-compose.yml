services:
  postgres:
    image: postgres:16-alpine
    container_name: suraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: suraksha_local_2026
      POSTGRES_DB: suraksha
    ports:
      - "5433:5432"
    volumes:
      - suraksha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha -d suraksha"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  suraksha_pgdata:
